name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest --cov=pepper_pet --cov-report=term-missing --cov-fail-under=90
      - run: python -m pepper_pet.cli validate pet --json
      - run: python tools/write_provenance.py --check
      - run: python tools/update_checksums.py --check
      - run: python tools/sync_site_asset.py --check
      - run: python tools/preflight.py --version v0.1.0
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: pepper-pet --version

  release-determinism:
    name: Deterministic release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python tools/release_audit.py --version v0.1.0
      - run: python -m build
      - run: python -m pepper_pet.cli package --repo-root . --out-dir dist --version v0.1.0 --json
      - uses: actions/upload-artifact@v7
        with:
          name: pepper-release-candidate
          path: |
            dist/pepper-carrot-codex-pet-v0.1.0.zip
            dist/release-manifest.json
            dist/SHA256SUMS

  installer:
    name: Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Install on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex"
          export PEPPER_CARROT_SOURCE_ROOT="$GITHUB_WORKSPACE"
          sh scripts/install.sh
          pepper-pet doctor --source pet --codex-home "$CODEX_HOME" --json
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex"
          ./scripts/install.ps1 -SourceRoot $env:GITHUB_WORKSPACE
          pepper-pet doctor --source pet --codex-home $env:CODEX_HOME --json
      - name: Demonstrate corruption recovery
        run: python examples/demo_repair.py --source pet
