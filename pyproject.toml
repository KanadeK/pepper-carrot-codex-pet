[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pepper-carrot-codex-pet"
version = "0.1.0"
description = "A validated Codex v2 desktop pet and self-repair toolkit for Pepper from the libre webcomic Pepper&Carrot."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = [
  "codex",
  "codex-pet",
  "desktop-pet",
  "peppercarrot",
  "creative-commons",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=10.4,<13"]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.12.7",
]

[project.scripts]
pepper-pet = "pepper_pet.cli:main"

[project.urls]
Homepage = "https://kanadek.github.io/pepper-carrot-codex-pet/"
Repository = "https://github.com/KanadeK/pepper-carrot-codex-pet"
Issues = "https://github.com/KanadeK/pepper-carrot-codex-pet/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pepper_pet"]

[tool.hatch.build]
exclude = ["/artwork/**"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pepper_pet"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
